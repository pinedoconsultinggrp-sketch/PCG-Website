<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Thank You</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@600;700&display=swap" />
    <style>
      :root{
        --navy:#1F3A5F; --clay:#C4562F; --clay-dark:#A8451F;
        --ink:#2D2A33; --muted:#63606B; --bg:#FFFCF8; --tint:#FFF4EC;
        --surface:#FFFFFF; --line:#EDE4DA; --radius:14px;
        --display:Outfit,ui-sans-serif,system-ui,sans-serif;
        --body:Figtree,ui-sans-serif,system-ui,sans-serif;
      }
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
        padding:24px;background:var(--tint);color:var(--ink);font-family:var(--body);
        font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
      .card{max-width:34rem;text-align:center;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--radius);padding:44px 36px}
      h1{font-family:var(--display);font-weight:700;color:var(--navy);
        font-size:clamp(26px,5vw,34px);line-height:1.15;letter-spacing:-.03em;margin:0 0 14px;
        text-wrap:balance}
      p{color:var(--muted);margin:0 0 26px}
      .btn{display:inline-block;background:var(--clay);color:#fff;text-decoration:none;
        border-radius:999px;padding:12px 26px;font-weight:600;font-size:15px;
        transition:background .15s ease}
      .btn:hover{background:var(--clay-dark)}
      :focus-visible{outline:2px solid var(--clay);outline-offset:2px}
      @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h1>Thank you!</h1>
      <p>We have received your message and will get back to you shortly.</p>
      <a class="btn" href="/">Return to home</a>
    </div>
  </body>
</html>
